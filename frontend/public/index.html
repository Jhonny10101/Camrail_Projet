<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1628" />
    <title>CAMRAIL — Modèle Prédictif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      :root {
        --red: #C8102E;
        --navy: #0A1628;
        --navy-mid: #132844;
        --steel: #2A4A6F;
        --silver: #7A8FA8;
        --mist: #E8EEF5;
        --white: #FFFFFF;
        --green: #0F7A4A;
        --orange: #D97706;
        --font-display: "Outfit", system-ui, sans-serif;
        --font-body: "IBM Plex Sans", system-ui, sans-serif;
        --radius: 14px;
        --shadow: 0 8px 32px rgba(10, 22, 40, 0.1);
        --shadow-sm: 0 2px 12px rgba(10, 22, 40, 0.06);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(200,16,46,0.08), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(42,74,111,0.12), transparent 50%),
          linear-gradient(180deg, #F4F7FB 0%, #E8EEF5 100%);
        font-family: var(--font-body);
        color: var(--navy);
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea { font-family: inherit; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulseSoft {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .fade-up { animation: fadeUp 0.45s ease both; }
      .fade-up-d1 { animation: fadeUp 0.5s 0.06s ease both; }
      .fade-up-d2 { animation: fadeUp 0.55s 0.12s ease both; }
      @media (max-width: 767px) {
        input, select, textarea { font-size: 16px !important; } /* avoid iOS zoom */
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #c5d0de; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
